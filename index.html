<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Daylog</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daylog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap">
<style>
/* Layout: one quiet column under a night sky. Tabs sit at the bottom on phones and become a rail on wide screens. */
:root{
  color-scheme: dark;
  --ink:#0b0e1b; --sky:#10142a; --panel:#151a31; --panel-2:#1b2140; --line:#252c4c; --line-2:#323a62;
  --fg:#e4e6f2; --fg-2:#a8adca; --fg-3:#6e7494;
  --star:#f3efe2; --lav:#b8a7ff; --blue:#86b6ff; --gold:#e9c873; --mint:#7cc9b0; --rose:#e3928f;
  --mood:#9580ec; --body:#2ea692; --game:#f4845f;
  --acc:#b8a7ff; --acc-text:#b8a7ff; --acc-soft:rgba(184,167,255,.16);
  --warn:#e6b363; --good:#7fd1a5; --main:#d79ac4;
  --m0:#1a1f37; --m1:#2b2d55; --m2:#3f3f80; --m3:#5b55ad; --m4:#7f74d6; --m5:#b3a6ff;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px;
  --nav-h:62px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.6;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(243,239,226,.35), transparent 60%),
    radial-gradient(1px 1px at 72% 9%, rgba(243,239,226,.25), transparent 60%),
    radial-gradient(1.5px 1.5px at 38% 62%, rgba(184,167,255,.22), transparent 60%),
    radial-gradient(1px 1px at 86% 44%, rgba(243,239,226,.2), transparent 60%),
    radial-gradient(1px 1px at 22% 84%, rgba(243,239,226,.18), transparent 60%),
    radial-gradient(1200px 600px at 80% -10%, #161b3a 0%, transparent 70%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{scrollbar-gutter:stable} /* 縦のスクロールバーが出る・消えるときに、画面全体が左右にずれないよう、いつも場所を空けておく（スクロールするのは body） */
@media (max-width:959px){input,select,textarea{font-size:16px!important}}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* アイコン（Lucide）：文字の横に置いたときの位置をそろえる */
.lu{flex:none;vertical-align:-3px}
.ic-row{display:flex;align-items:center;gap:8px}
.flag,.pill,.md-chip,.toggle,.cl-badge,.calchip{display:inline-flex;align-items:center;gap:4px}
.gmark,.gc-g > i{display:inline-grid;place-items:center}
button.btn > .lu{margin-right:4px}
.disp{font-family:var(--f-disp)}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--fg-3)}

/* frame */
.frame{min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
.frame.has-composer{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 128px)}
.main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:rgba(11,14,27,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-3);font-size:10px;letter-spacing:.02em;padding:0;min-width:0;white-space:nowrap}
.nav button .g{font-size:18px;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols",var(--f-body)}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] .g{color:var(--lav)}
.gi{display:none}
@media (min-width:960px){
  .frame,.frame.has-composer{padding-bottom:24px;padding-left:96px}
  .nav{top:0;bottom:0;right:auto;width:84px;height:auto;grid-template-columns:1fr;grid-auto-rows:72px;align-content:center;border-top:0;border-right:1px solid var(--line);padding-bottom:0}
  .frame.has-composer .main{padding-bottom:152px}
}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:8px 4px}
.top h1{font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1.25;margin:0;letter-spacing:.02em;text-wrap:balance}
.top .sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fg-2);margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2)}
.icon-btn[aria-pressed="true"]{color:#17132f;background:var(--lav);border-color:var(--lav)}
.back{background:none;border:0;color:var(--fg-2);font-size:15px;padding:8px 12px 2px 0;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--fg)}
.night-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:1px solid #3a3470;background:linear-gradient(180deg,#221d4a,#181538);color:var(--lav);font-weight:500;font-size:14px}
.night-btn:hover{border-color:var(--lav)}
h2.sec{font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--fg-3);margin:24px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2.sec .r{letter-spacing:0;font-size:12px}

/* mode chips */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
/* 夜モード：今日の振り返り（nv-）とペットの一言（np-） */
.nv{padding:4px 16px}
.nv-row{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.nv-row:first-child{border-top:0}
.nv-k{color:var(--fg-3);font-size:12.5px;padding-top:1px}
.nv-v{min-width:0;overflow-wrap:anywhere}
.nv-pr{display:flex;flex-wrap:wrap;gap:4px 12px;margin-right:8px}
.nv-pr > span{white-space:nowrap}
.nv-pr .yk-dot{width:11px;height:11px;margin-right:4px;vertical-align:-1px}
.nv-last{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.np{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.np-pet{height:96px;display:grid;place-items:end center}
.np-bubble{position:relative;max-width:30em;width:100%;padding:16px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:15px;line-height:1.7;white-space:pre-wrap;min-height:52px}
.np-bubble::before{content:'';position:absolute;top:-7px;left:50%;width:12px;height:12px;background:inherit;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.np-bubble b{color:var(--fg)}
.np-bubble.busy{display:grid;place-items:center}
.np-name{font-size:12px;color:var(--fg-3)}
/* 自分との約束：体調ボタンの下に3つ。1回で最低ライン（半分）、2回でふつう（全部） */
.yk-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.yk-b{position:relative;display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;padding:8px 12px 8px 8px;border-radius:999px;background:var(--panel);border:1px solid transparent;color:var(--fg-2);font-size:13.5px;line-height:1.2;cursor:pointer;transition:background-color var(--t-open,.2s),color var(--t-open,.2s),border-color var(--t-open,.2s)}
.yk-dot{flex:none;display:inline-block;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--gold);box-sizing:border-box;background:transparent;vertical-align:-2px}
.yk-dot.min{background:linear-gradient(90deg,var(--gold) 50%,transparent 50%)}
.yk-dot.full{background:var(--gold)}
.yk-b:not(.min):not(.full) .yk-dot{border-color:var(--fg-3)}
.gc-g .yk-dot{width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.md-chip .yk-dot{width:10px;height:10px;margin-right:-4px}
.yk-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yk-b.min,.yk-b.full{color:var(--fg)}
.yk-b.full{background:color-mix(in srgb,var(--gold) 13%,var(--panel))}
.yk-bar.all .yk-b{border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.yk-tip{position:absolute;left:50%;top:calc(100% + 6px);z-index:3;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:500;color:var(--gold);background:var(--panel-2,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));padding:4px 8px;border-radius:999px;pointer-events:none;animation:yk-tip 1.8s ease both}
@keyframes yk-tip{0%{opacity:0;transform:translate(-50%,-3px)}12%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
html[data-motion="calm"] .yk-tip{animation:none;opacity:1}
.fx .yk-dot{animation:t-like-pop 320ms var(--t-spring)}
html:not(.classic) .yk-b{border-radius:999px}
/* 今日の流れの約束の行 */
/* 約束の編集・夜モード */
.yk-row .yk-sub{flex-basis:100%;font-size:11.5px;color:var(--fg-3);line-height:1.45}
.yk-ck{background:transparent!important;border-color:transparent!important}.yk-ck .yk-dot{width:18px;height:18px}
.yk-notify{margin-top:8px;font-size:13px;gap:8px}
.yk-notify input[type=time]{width:auto;min-width:118px}
.yk-check .box,.yk-check[aria-pressed="true"] .box{display:grid;place-items:center;background:transparent!important;border-color:transparent!important}.yk-check .box .yk-dot{width:20px;height:20px}
.yk-check .yk-st{display:block;font-size:12px;margin-top:2px}
.yk-check.full{border-color:var(--gold)}
.yk-check.min{border-color:color-mix(in srgb,var(--gold) 45%,var(--line-2))}
.mode{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px;text-align:center;font-size:14px;color:var(--fg-2);line-height:1.3}
.mode small{display:block;font-size:10px;color:var(--fg-3);letter-spacing:.05em}
.mode[aria-pressed="true"]{border-color:var(--c);color:var(--fg);background:color-mix(in oklab,var(--c) 14%,var(--panel))}
.mode[aria-pressed="true"] small{color:var(--fg-2)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.card + .card{margin-top:8px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note{display:flex;gap:8px;align-items:flex-start}
.note .k{flex-shrink:0;font-size:11px;letter-spacing:.1em;color:var(--fg-3);padding-top:2px;min-width:4.5em}
.note .v{min-width:0;flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--lav)}
.btn.primary{background:var(--lav);border-color:var(--lav);color:#17132f;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 8px;font-size:12px}
.link{background:none;border:0;padding:0;color:var(--lav);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.big-time{font-family:var(--f-mono);font-size:24px;font-weight:500;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.pill.warn{border-color:#6b5426;color:var(--warn)}
.pill.gold{border-color:#5f5230;color:var(--gold)}
.err{color:var(--warn);font-size:13px}

/* timeline */
.allday-band{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
.ad-list{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.ad-lb{flex:none;font-size:11px;line-height:30px;color:var(--fg-3)}
.ad{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:30px;padding:4px 12px 4px 8px;border-radius:8px;font-size:13px;line-height:1.3;color:var(--fg);background:color-mix(in oklab,var(--c) 12%,var(--panel));border:1px solid color-mix(in oklab,var(--c) 32%,var(--line))}
.ad:hover{background:color-mix(in oklab,var(--c) 18%,var(--panel))}
.ad-bar{flex:none;width:3px;height:14px;border-radius:2px;background:var(--c)}
.ad-t{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ad-n{flex:none;font-size:11px;color:var(--fg-2)}
.ad-c{flex:none;font-size:11px;color:var(--fg-3)}
.allday{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.allday span{font-size:12px;border-radius:6px;padding:2px 8px;background:color-mix(in oklab,var(--c) 16%,var(--panel));border:1px solid color-mix(in oklab,var(--c) 40%,var(--line))}
/* 今日の流れ（2026-11-28 作り直し）
   左の列（--tc）に時刻、真ん中（--g）に1本の線と点、右に中身。行は「目印・記録・まとまり（睡眠／予定）」の3種類だけ。
   高さ・余白は 8px きざみ（細かいところだけ 4px）。色は線と点がグレー、いまだけ青、予定はカレンダーの色を細い縁だけに */
.flow{--tc:48px;--g:24px;--rx:calc(var(--tc) + var(--g) / 2);--row:24px;list-style:none;margin:8px 0 0;padding:0;position:relative}
.flow > li{position:relative}
.flow > li::before{content:"";position:absolute;left:calc(var(--rx) - .5px);top:0;bottom:0;width:1px;background:var(--line-2);z-index:0}
.flow > li:first-child::before{top:12px}
.flow > li:last-child::before{bottom:auto;height:12px}
.flow .fl,.flow .fr{display:grid;grid-template-columns:var(--tc) minmax(0,1fr);column-gap:var(--g);align-items:start;position:relative;z-index:1}
.flow .fl{padding:4px 0}
.flow time{position:relative;font-size:12px;line-height:var(--row);color:var(--fg-3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.flow .c2{min-width:0;line-height:var(--row)}
/* 線の上の点：ふつうは 8px の輪 */
.flow .fl > time::after,.flow .fr > time::after{content:"";position:absolute;right:calc(var(--g) / -2 - 4px);top:8px;width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--fg-3);background:var(--ink)}
.flow .fr:not(.fr-h):not(.fr-now):not(.fr-k):not(.fr-s):not(.fr-w) > time::after{display:none}
.fl-lb{display:inline-flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13px}
.fl-lb .lu{color:var(--fg-3)}
.fl-sub{margin-left:8px;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.ic-lead{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--fg-3)}
/* 記録 */
.fl-en .c2,.fr-k .c2{overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px}
.en-t{display:inline}
.fl-en > time::after,.fr-k > time::after{border-color:var(--fg-2)}
.flow .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;white-space:normal;line-height:1}
.flow button.more{float:right;display:inline-grid;place-items:center;width:24px;height:24px;margin-left:8px;padding:0;border:0;border-radius:8px;background:none;color:var(--fg-3)}
.flow button.more:hover,.flow button.more[aria-expanded="true"]{color:var(--fg);background:var(--panel-2)}
/* 「…」：マウスでは指した行だけ、指の端末では薄く */
.flow button.more,.evmore{opacity:.6}
@media (hover:hover){.flow button.more,.evmore{opacity:0}.flow li:hover button.more,.flow .fr:hover button.more,.ev:hover .evmore,.flow button.more:focus-visible,.evmore:focus-visible,.flow button.more[aria-expanded="true"],.evmore[aria-expanded="true"]{opacity:1}}
.en-menu{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;white-space:normal}
.nap{display:inline-flex;vertical-align:-2px;margin-right:4px;color:var(--fg-3)}
.flow .ee{white-space:normal}
.flow .ee textarea{width:100%;min-height:64px}
.ee-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.ee-f{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg-3)}
.ee-f select{padding:4px 8px}
/* 約束の行：点は金（約束だけの色） */
.fl-yk > time::after,.fr-yk > time::after{border-color:var(--gold)}
.yk-line{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.yk-line .yk-dot{width:12px;height:12px}
/* 睡眠のまとまり：寝た → 起きた。線は点線（眠っていた時間） */
.flow > li.fl-sleep{padding:4px 0}
.flow > li.fl-sleep:not(.solo)::after{content:"";position:absolute;left:calc(var(--rx) - .5px);top:20px;bottom:20px;border-left:1px dashed var(--fg-3);z-index:1}
.fl-sleep .fr + .fr{margin-top:8px}
.fl-sleep .fr > time::after{background:var(--fg-3);border-color:var(--fg-3)}
.fl-sleep .fr-s .c2,.fl-sleep .fr-w .c2{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px}
.sl-d{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
/* 就寝：目印の1行 */
.fl-bed .c2{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px}
.fl-bed .bl-t{cursor:pointer}
.fl-bed > time::after{border-style:dashed}
.fl-bed.done > time::after{border-style:solid;background:var(--fg-3)}
.fl-bed.done .bl-t{color:var(--fg)}
.fl-bed .iconbtn.sm,.fl-bed .bell{margin-left:4px}
/* いま：流れの中でいちばん目立つ点（青はここと押せるものだけ） */
.fl-now time,.fr-now time{color:var(--acc-text);font-weight:600}
.flow .fl-now > time::after,.flow .fr-now > time::after{width:12px;height:12px;top:6px;right:calc(var(--g) / -2 - 6px);border:0;background:var(--acc);box-shadow:0 0 0 4px color-mix(in oklab,var(--acc) 24%,transparent)}
.fl-now .c2,.fr-now .c2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--acc-text)}
.fl-now .c2::after,.fr-now .c2::after{content:"";flex:1;border-top:1px solid color-mix(in oklab,var(--acc) 60%,transparent)}
.flow > li.fl-now{padding:0}
/* 予定のまとまり：面の色はそろえ、カレンダーの色は左の細い縁と線だけ */
.flow > li.ev{margin:4px 0}
.flow > li.ev::before{width:2px;left:calc(var(--rx) - 1px);top:12px;bottom:12px;background:var(--c)}

/* ── 動き（transitions.dev の無料の部品をもとに作り直したもの。同サイトの条件で、自分のアプリに改造して使ってよい。数値は同サイトの既定値をもとに調整）

@keyframes t-ov-in{from{opacity:0}}

/* 押した感触：押している間は少し沈み、離すと（描き直されても）ぽんと戻る */
.btn,.tm-ic,.mstar,.mfav-btn,.msearch-btn,.check,.mode,.seg button,.mtabs button,.tm-presets button,.nav button .gi,.iconbtn,.icon-btn,.night-btn,.nfab,.gmore,.gplus,.chip,.pill[data-act]{transition:transform 120ms var(--t-ease),background-color 160ms var(--t-ease),border-color 160ms var(--t-ease),color 160ms var(--t-ease),opacity 160ms var(--t-ease)}

.wk-ev.can-drag{touch-action:pan-y}

.crumbs button[aria-current="true"]{color:var(--fg);font-weight:500}
.crumbs .sep{color:var(--fg-3)}
.skybox{position:relative;margin-top:8px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 40%,#141a3a 0%,#0a0d1c 70%)}
.skybox canvas{display:block;width:100%;touch-action:manipulation}
.skynav{position:absolute;top:8px;right:8px;display:flex;gap:8px}
.skynav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:rgba(16,20,42,.8);color:var(--fg-2)}
.skynav{z-index:3}
.crumbs .spacer{flex:1}
.crumbs .crumb-today{font-size:12px;padding:4px 8px;border:1px solid var(--line-2);border-radius:999px;color:var(--fg-2)}
.gx{position:relative;overflow:hidden;background:#01030a;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.gx canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.gx .gx-ov{pointer-events:none}
.gx-hud{position:absolute;left:12px;top:10px;right:92px;display:flex;align-items:center;gap:8px;pointer-events:none;text-shadow:0 1px 10px #000,0 0 2px #000}
.gx-back{pointer-events:auto;flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(8,12,28,.62);color:#cfe0ff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gx-back[hidden]{display:none}
.gx-title{font-size:21px;font-weight:600;line-height:1.15;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:#eef4ff}
.gx-sub{font-size:11.5px;line-height:1.4;color:rgba(204,217,245,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gx-hud > div{min-width:0}
.gx-rail{position:absolute;left:0;right:0;bottom:0;height:60px;padding:8px 12px 20px;display:flex;align-items:flex-end;gap:1px;background:linear-gradient(transparent,rgba(1,3,10,.86) 55%);touch-action:none;cursor:pointer;outline:none}
.gx-rail:focus-visible{box-shadow:inset 0 -2px 0 #8ec5ff}
.gx-rail i{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;font-style:normal}
.gx-rail b{display:block;width:3px;height:var(--h);border-radius:2px;background:var(--c);opacity:.62;transition:opacity .15s,transform .15s}
.gx-rail .z b{width:3px;border-radius:50%;background:#aebbdc;opacity:.3}
.gx-rail .fut b{opacity:.14}
.gx-rail .on b,.gx-rail .sel b{opacity:1;box-shadow:0 0 8px var(--c);transform:scaleX(1.5)}
.gx-rail .sel::before,.gx-rail .on::before{content:"";position:absolute;left:50%;bottom:-5px;width:5px;height:5px;margin-left:-4px;border-radius:50%;background:#8ec5ff;box-shadow:0 0 6px #8ec5ff}
.gx-rail .on::before{background:#fff;box-shadow:0 0 6px #fff}
.gx-rail i::after{content:attr(data-l);position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);font-size:9px;line-height:1;white-space:nowrap;color:rgba(190,204,236,.55);font-variant-numeric:tabular-nums}
.gx-rail .today::after{color:#8ec5ff;font-weight:700}
.gx-rail .sel::after,.gx-rail .on::after{content:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;background:var(--c)}
.legend i.neb{width:14px;height:8px;border-radius:50%;background:radial-gradient(closest-side,rgba(150,130,230,.55),transparent)}
.cname{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:.04em}

/* review */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 16px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tile .n{font-family:var(--f-mono);font-size:22px;font-weight:500}
.tile .n small{font-size:12px;color:var(--fg-3);font-weight:400}
.tile .l{font-size:12px;color:var(--fg-2)}
.chart{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px}
.chart .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px}
.chart .lg{display:flex;gap:12px;font-size:12px;color:var(--fg-2)}
.chart .lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px;background:var(--c)}
.chart .lg i.dot{width:8px;height:8px;border-radius:50%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{fill:var(--fg-3);font-family:var(--f-mono);font-size:10px}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal7 .h{font-size:10px;color:var(--fg-3);text-align:center}
.cal7 .c{aspect-ratio:1;border-radius:7px;background:var(--m0);position:relative;font-family:var(--f-mono);font-size:10px;color:rgba(228,230,242,.7);padding:4px 4px;max-width:100%}
.cal7 .c.blank{background:transparent}
.cal7 .c.today{outline:1.5px solid var(--lav);outline-offset:1px}
.cal7 .c .neb{position:absolute;inset:0;border-radius:7px;background:radial-gradient(closest-side,rgba(184,167,255,.35),transparent)}
.ramp{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3);margin-top:8px}
.ramp i{width:14px;height:10px;border-radius:3px;display:inline-block}
.insight{white-space:pre-wrap}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,8,18,.86);backdrop-filter:blur(6px);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{max-width:560px;margin:6vh auto 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .card{padding:16px}
.sheet h3{font-family:var(--f-disp);font-size:22px;margin:0 0 8px;font-weight:700;text-wrap:balance}
.steps-dots{display:flex;gap:8px;justify-content:center;margin:16px 0 8px}
.steps-dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.steps-dots i.on{background:var(--lav)}
.steps-dots i.done{background:#5c5299}
.nm-title{text-align:center;font-family:var(--f-disp);font-size:24px;font-weight:700;margin:8px 0 2px}
.nm-sub{text-align:center;color:var(--fg-2);font-size:13px;margin-bottom:16px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{border:1px solid var(--line-2);background:var(--sky);border-radius:10px;padding:8px 0;font-family:var(--f-mono);font-size:16px;color:var(--fg-2)}
.scale button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in oklab,var(--c) 22%,var(--sky));color:var(--fg)}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3);margin-top:4px}
textarea.field{width:100%;resize:vertical;min-height:84px;line-height:1.6}
.plan-item{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"time min nm del";gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:0}
.plan-item .nm{grid-area:nm;min-width:0;overflow-wrap:anywhere}
.plan-item input[type="time"]{grid-area:time;width:108px}
.plan-item select{grid-area:min;width:84px}
.plan-item .del{grid-area:del}
@media (max-width:520px){.plan-item{grid-template-columns:auto auto 1fr;grid-template-areas:"time min del" "nm nm nm";row-gap:4px}.plan-item .del{justify-self:end}}
.pick-list{display:flex;flex-wrap:wrap;gap:8px}
.pick-list button{border:1px dashed var(--line-2);background:transparent;border-radius:8px;padding:4px 8px;font-size:13px;color:var(--fg-2);text-align:left;max-width:100%;overflow-wrap:anywhere}
.pick-list button:hover{border-color:var(--blue);color:var(--fg)}
.sendlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.sendlist li{display:flex;gap:8px;align-items:baseline}
.sendlist .st{width:18px;flex-shrink:0;text-align:center}
.bigcheck{display:flex;gap:16px;align-items:center;width:100%;border:1px solid var(--line-2);background:var(--sky);border-radius:14px;padding:16px;font-size:17px;text-align:left}
.bigcheck[aria-pressed="true"]{border-color:var(--gold);background:#231f12}
.bigcheck .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;flex-shrink:0}
.bigcheck[aria-pressed="true"] .box{background:var(--gold);border-color:var(--gold);color:#2a2008}
.rise{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 100% at 50% 100%,#1a1840 0%,#0a0c1a 75%);border:1px solid var(--line)}
.rise canvas{display:block;width:100%}
.rise .nm{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:var(--f-disp);font-size:24px;font-weight:700;letter-spacing:.06em;opacity:0;transition:opacity 1.6s ease 2.6s}
.rise.go .nm{opacity:1}
.rise.static .nm{opacity:1;transition:none}
.claude{border-left:2px solid var(--lav);padding:2px 0 2px 12px;white-space:pre-wrap}
.note-local{border-left:2px solid var(--line-2);padding:2px 0 2px 12px;white-space:pre-wrap;font-size:14px;color:var(--fg-2)}
.thinking{color:var(--fg-3);font-size:13px}
.thinking::after{content:"…";animation:blink 1.2s steps(3) infinite}
@keyframes blink{50%{opacity:.3}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 140px);z-index:60;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 16px;font-size:13px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.tip{position:fixed;z-index:70;pointer-events:none;background:#0f1328;border:1px solid var(--line-2);border-radius:8px;padding:8px 8px;font-size:12px;line-height:1.5;white-space:pre-wrap;max-width:min(320px,calc(100vw - 24px));box-shadow:0 6px 20px rgba(0,0,0,.4)}
.gamechip{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:help}
.ichip{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2)}
.ichip svg{color:var(--fg-3)}
.ichip b{font-weight:500}
.iconbtn{background:none;border:0;color:var(--fg-3);padding:4px;border-radius:7px;display:inline-grid;place-items:center;line-height:1}
.iconbtn:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.iconbtn:disabled{opacity:.4}
.plusbtn{font-size:16px;width:24px;height:24px;margin-right:2px}
.iconbtn.chev{align-self:center}
.iconbtn.chev svg{transition:transform .15s}
.iconbtn.chev.open svg{transform:rotate(90deg)}
.info{background:none;border:1px solid var(--line-2);color:var(--fg-3);width:16px;height:16px;border-radius:50%;font:italic 600 10px/14px Georgia,serif;padding:0;margin-left:8px;vertical-align:middle;cursor:help}
.info:hover{color:var(--fg-2);border-color:var(--fg-3)}
.nap{margin-right:8px}
.bell{display:inline-flex;align-items:center;gap:1px;vertical-align:-2px}
.mode{padding:8px 4px}
.top .sub{gap:16px}
.taskadd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:8px}
.taskadd .line{display:flex;gap:8px;align-items:center}
.taskadd .plus{color:var(--fg-3);font-size:16px}
.taskadd .field.grow{border:0;background:transparent;padding:8px 0;flex:1;min-width:0}
.taskadd .more,.taskadd .add{display:none}
.taskadd.open,.taskadd:focus-within{border-color:var(--line-2)}
.taskadd.open .more{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 4px}
.taskadd.open .add{display:inline-block}
.settings .item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.settings .item:last-child{border-bottom:0}
.settings .item .l{min-width:0;flex:1 1 220px}
.settings .item .l small{display:block;color:var(--fg-3);font-size:12px}
.settings .bk-err{color:var(--warn)}
.imgbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;max-width:320px}
.imgbar i{display:block;height:100%;border-radius:inherit;background:var(--blue);transition:width var(--t-open) var(--t-ease)}
.imgbar.warn i{background:var(--warn)}
.settings .errbox{display:block}
.errlist{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:420px;overflow:auto;overscroll-behavior:contain}
.errlist li{padding:8px 12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.errlist .er-h{display:flex;gap:8px;align-items:baseline;font-size:13px;overflow-wrap:anywhere}
.errlist .er-n{color:var(--warn);font-size:12px;flex:none}
.errlist .er-m{color:var(--fg-3);font-size:11.5px;margin-top:2px;overflow-wrap:anywhere}
.errlist details{margin-top:8px}.errlist summary{cursor:pointer;color:var(--fg-3);font-size:12px}
.errlist pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;margin:8px 0 0;color:var(--fg-2);max-height:200px;overflow:auto}
.switch{width:46px;height:26px;border-radius:13px;border:1px solid var(--line-2);background:var(--sky);position:relative;flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg-3);transition:transform .15s}
.switch[aria-checked="true"]{background:#2a2456;border-color:var(--lav)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--lav)}
.wd{display:flex;gap:4px}
.wd button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--fg-3);font-size:13px;padding:0}
.wd button[aria-pressed="true"]{border-color:var(--lav);color:var(--fg);background:#1f1b42}
.center-msg{max-width:520px;margin:18vh auto 0;padding:0 24px;text-align:center}
.center-msg h1{font-family:var(--f-disp);font-size:30px;margin:0 0 8px}
/* calendar */
.btn.danger{background:var(--warn);border-color:var(--warn);color:#2a1c05;font-weight:700}
.calchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.calchip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 8px 4px 8px;font-size:12px;color:var(--fg-3);display:inline-flex;align-items:center;gap:8px}
.calchip::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px solid var(--c)}
.calchip[aria-pressed="true"]{color:var(--fg)}
.calchip[aria-pressed="true"]::before{background:var(--c)}
.wk{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.wk-row{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr))}
.wk-head{border-bottom:1px solid var(--line)}
.wk-h{text-align:center;padding:8px 0 4px;font-size:11px;color:var(--fg-3);line-height:1.2}
.wk-h b{display:block;margin:2px auto 0;width:28px;height:28px;line-height:28px;font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--fg-2)}
.wk-h.is-today b{color:#17132f;background:var(--lav);border-radius:50%}
.wk-h.sun span,.n.sun{color:var(--rose)}
.wk-h.sat span,.n.sat{color:var(--blue)}
.wk-all{border-bottom:1px solid var(--line);min-height:24px}
.wk-a{padding:2px 1px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line)}
.wk-g{font-size:10px;color:var(--fg-3);text-align:right;padding:4px 4px 0 0;font-family:var(--f-mono)}
.wk-scroll{max-height:min(66vh,720px);overflow-y:auto;overscroll-behavior:contain}
.wk-body{position:relative}
.wk-hours{position:relative;padding:0}
.wk-hr{position:absolute;right:4px;transform:translateY(-5px);font-size:10px}
.wk-hr:first-child{transform:none}
.wk-col{position:relative;min-width:0;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px;cursor:copy}
.wk-col.is-today{background-color:rgba(184,167,255,.05)}
.wk-ev{position:absolute;border:0;border-left:3px solid var(--c);background:color-mix(in oklab,var(--c) 28%,var(--panel));color:var(--fg);border-radius:4px;padding:2px 4px;text-align:left;overflow:hidden;font-size:10.5px;line-height:1.25;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.wk-ev .t{overflow-wrap:anywhere;font-weight:500}
.wk-ev .m{font-family:var(--f-mono);font-size:9.5px;color:var(--fg-2)}
.wk-ev:hover{filter:brightness(1.15)}
.wk-now{position:absolute;left:0;right:0;height:2px;background:var(--lav);box-shadow:0 0 6px var(--lav);pointer-events:none}
.wk-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--lav)}
.ev-chip{border:0;border-left:3px solid var(--c);background:color-mix(in oklab,var(--c) 22%,var(--panel));border-radius:3px;font-size:10px;padding:1px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);max-width:100%}
.mo{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.mo-w{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;color:var(--fg-3);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mo-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mo-c{min-height:82px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:4px 2px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;min-width:0;color:var(--fg)}
.mo-c:nth-child(7n){border-right:0}
.mo-c.out{opacity:.4}
.mo-c.sel{background:rgba(184,167,255,.09)}
.mo-c .n{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);padding:0 4px;align-self:flex-start}
.mo-c.is-today .n{color:#17132f;background:var(--lav);border-radius:10px}
.mo-e{display:block;font-size:10px;line-height:1.35;border-left:2px solid var(--c);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.mo-more{font-size:10px;color:var(--fg-3);padding-left:4px}
.mo-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.mo-li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;border:0;border-left:3px solid var(--c);background:var(--sky);border-radius:6px;padding:8px 8px;text-align:left;color:var(--fg);font-size:14px}
.mo-li .t{min-width:0;overflow-wrap:anywhere}
/* ── ペット（白1色のドット絵。今日・星空のタブのすみと、ペットの部屋） ── */
.pet-svg{display:block;image-rendering:pixelated}
.pet-lane{position:relative;flex:1;min-width:64px;align-self:stretch;margin:0 8px;pointer-events:none;container-type:inline-size}
.pet-mini{position:absolute;bottom:-6px;left:0;width:40px;height:40px;padding:0;border:0;background:none;color:var(--fg);cursor:pointer;pointer-events:auto;--pet-paper:var(--ink);animation:pet-walk 22s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.pet-mini:focus-visible{outline:2px solid var(--lav);outline-offset:3px;border-radius:10px}
.pet-lane.still .pet-mini{animation:none;left:calc(50% - 20px)}
@keyframes pet-walk{0%,10%{transform:translateX(0)}40%,60%{transform:translateX(calc(100cqw - 40px))}90%,100%{transform:translateX(0)}} /* 動かすのは transform だけ（配置の計算をし直さない） */
.pet-body{display:block;position:relative;animation:pet-bob 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pet-bob{0%,20%,40%,66%,82%,100%{transform:translateY(0)}10%,30%{transform:translateY(-2px)}72%{transform:translateY(-8%)}}
.pet-body.is-egg{animation:pet-wobble 3.2s ease-in-out infinite}
@keyframes pet-wobble{0%,64%,100%{transform:rotate(0)}72%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
.pet-body.f-sleep{animation:pet-breathe 3.6s ease-in-out infinite}
@keyframes pet-breathe{50%{transform:scale(1.04,.96)}}
.pet-body.is-fx{animation:pet-hop .45s ease-out 4}
@keyframes pet-hop{50%{transform:translateY(-14%)}}
