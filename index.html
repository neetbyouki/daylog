<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Daylog</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daylog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap">
<style>
/* Layout: one quiet column under a night sky. Tabs sit at the bottom on phones and become a rail on wide screens. */
:root{
  color-scheme: dark;
  --ink:#0b0e1b; --sky:#10142a; --panel:#151a31; --panel-2:#1b2140; --line:#252c4c; --line-2:#323a62;
  --fg:#e4e6f2; --fg-2:#a8adca; --fg-3:#6e7494;
  --star:#f3efe2; --lav:#b8a7ff; --blue:#86b6ff; --gold:#e9c873; --mint:#7cc9b0; --rose:#e3928f;
  --mood:#9580ec; --body:#2ea692; --game:#5b8fd9;
  --warn:#e6b363; --good:#7fd1a5; --main:#d79ac4;
  --m0:#1a1f37; --m1:#2b2d55; --m2:#3f3f80; --m3:#5b55ad; --m4:#7f74d6; --m5:#b3a6ff;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px;
  --nav-h:62px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.6;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(243,239,226,.35), transparent 60%),
    radial-gradient(1px 1px at 72% 9%, rgba(243,239,226,.25), transparent 60%),
    radial-gradient(1.5px 1.5px at 38% 62%, rgba(184,167,255,.22), transparent 60%),
    radial-gradient(1px 1px at 86% 44%, rgba(243,239,226,.2), transparent 60%),
    radial-gradient(1px 1px at 22% 84%, rgba(243,239,226,.18), transparent 60%),
    radial-gradient(1200px 600px at 80% -10%, #161b3a 0%, transparent 70%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:959px){input,select,textarea{font-size:16px!important}}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp)}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--fg-3)}

/* frame */
.frame{min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
.frame.has-composer{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 128px)}
.main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:rgba(11,14,27,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-3);font-size:10px;letter-spacing:.02em;padding:0;min-width:0;white-space:nowrap}
.nav button .g{font-size:18px;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols",var(--f-body)}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] .g{color:var(--lav)}
.gi{display:none}
@media (min-width:960px){
  .frame,.frame.has-composer{padding-bottom:24px;padding-left:96px}
  .nav{top:0;bottom:0;right:auto;width:84px;height:auto;grid-template-columns:1fr;grid-auto-rows:72px;align-content:center;border-top:0;border-right:1px solid var(--line);padding-bottom:0}
  .frame.has-composer .main{padding-bottom:150px}
}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:8px 4px}
.top h1{font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1.25;margin:0;letter-spacing:.02em;text-wrap:balance}
.top .sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fg-2);margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2)}
.icon-btn[aria-pressed="true"]{color:#17132f;background:var(--lav);border-color:var(--lav)}
.back{background:none;border:0;color:var(--fg-2);font-size:15px;padding:10px 12px 2px 0;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--fg)}
.night-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;border:1px solid #3a3470;background:linear-gradient(180deg,#221d4a,#181538);color:var(--lav);font-weight:500;font-size:14px}
.night-btn:hover{border-color:var(--lav)}
h2.sec{font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--fg-3);margin:22px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2.sec .r{letter-spacing:0;font-size:12px}

/* mode chips */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.mode{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px;text-align:center;font-size:14px;color:var(--fg-2);line-height:1.3}
.mode small{display:block;font-size:10px;color:var(--fg-3);letter-spacing:.05em}
.mode[aria-pressed="true"]{border-color:var(--c);color:var(--fg);background:color-mix(in oklab,var(--c) 14%,var(--panel))}
.mode[aria-pressed="true"] small{color:var(--fg-2)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card + .card{margin-top:8px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note{display:flex;gap:10px;align-items:flex-start}
.note .k{flex-shrink:0;font-size:11px;letter-spacing:.1em;color:var(--fg-3);padding-top:2px;min-width:4.5em}
.note .v{min-width:0;flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:9px;padding:7px 12px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--lav)}
.btn.primary{background:var(--lav);border-color:var(--lav);color:#17132f;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
.link{background:none;border:0;padding:0;color:var(--lav);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.big-time{font-family:var(--f-mono);font-size:24px;font-weight:500;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.pill.warn{border-color:#6b5426;color:var(--warn)}
.pill.gold{border-color:#5f5230;color:var(--gold)}
.err{color:var(--warn);font-size:13px}

/* timeline */
.allday{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.allday span{font-size:12px;border-radius:6px;padding:2px 8px;background:color-mix(in oklab,var(--c) 16%,var(--panel));border:1px solid color-mix(in oklab,var(--c) 40%,var(--line))}
.tl{list-style:none;margin:8px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl li{display:grid;grid-template-columns:50px 1fr;gap:16px;padding:7px 0;position:relative}
.tl time{font-family:var(--f-mono);font-size:12px;color:var(--fg-3);text-align:right;padding-top:2px}
.tl li::after{content:"";position:absolute;box-sizing:border-box;left:53px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--ink);border:1.5px solid var(--fg-3)}
.tl li.ev::after{border-color:var(--c);background:var(--c)}
.tl li.en::after{border-color:var(--star);background:var(--ink)}
.tl li.now{padding:2px 0}
.tl li.now::after{left:52px;top:5px;width:13px;height:13px;background:var(--lav);border-color:var(--lav);box-shadow:0 0 10px var(--lav)}
.tl li.now time{color:var(--lav)}
.tl li.now .tl-b{border-top:1px dashed #4b4387;margin-top:9px}
.ev .tl-b{position:relative}
/* 進行中の予定：文字の下に「いま」の線を引く帯を設け、文字と重ならないようにする */
.nowtrack{position:relative;height:28px;margin:2px 0 0 -10px}
.nowmark{position:absolute;left:-3px;right:0;height:0;border-top:1.5px dashed var(--lav);pointer-events:none;z-index:2}
.nowmark::before{content:"";position:absolute;left:-14px;top:-6.25px;width:11px;height:11px;border-radius:50%;background:var(--lav);box-shadow:0 0 10px var(--lav)}
.nowmark span{position:absolute;right:calc(100% + 16px);top:-13px;width:50px;text-align:right;font-family:var(--f-mono);font-size:12px;line-height:13px;color:var(--lav)}
.nowmark span small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.06em}
.tl-b{min-width:0}
.ev .tl-b{border-left:3px solid var(--c);padding:2px 0 2px 10px;background:color-mix(in oklab,var(--c) 7%,transparent);border-radius:0 8px 8px 0}
.ev .t{font-weight:500;overflow-wrap:anywhere}
.ev .m{font-size:12px;color:var(--fg-3);font-family:var(--f-mono)}
.en .tl-b{overflow-wrap:anywhere;white-space:pre-wrap}
.en .meta,.sub .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--fg-3);margin-top:2px;white-space:normal}
.en button.more,.sub button.more{float:right;background:none;border:0;color:var(--fg-3);padding:0 2px;font-size:13px}
.ev-head{cursor:pointer;position:relative}
.evmore{float:right;background:none;border:0;color:var(--fg-3);font-size:14px;line-height:1;padding:4px 8px;margin:-2px 0 0 4px;border-radius:6px;opacity:.6}
.evmore:hover,.evmore[aria-expanded="true"]{opacity:1;color:var(--fg-2)}
.evmenu{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;margin:6px 8px 2px 0}
.evmenu .link{color:var(--fg-2);text-decoration:none;font-size:12px}
.evmenu .link.danger{color:var(--rose)}
.evmenu .faint{font-size:11px}
.evstate{color:var(--fg-3)}
.ev.canceled .tl-b{opacity:.55;background:transparent;border-left-style:dashed}
.ev.canceled .ev-head .t{text-decoration:line-through;text-decoration-color:var(--fg-3)}
.ev.ended .tl-b{background:color-mix(in oklab,var(--c) 4%,transparent)}
.ev .tl-b:has(.sub),.ev.is-now .tl-b{padding-bottom:6px}
.kids{margin:6px 8px 0 4px;padding-left:14px;border-left:1px solid color-mix(in oklab,var(--c) 45%,transparent)}
.sub{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;padding:5px 0;position:relative}
.sub::before{content:"";position:absolute;left:-14px;top:13px;width:10px;height:1px;background:color-mix(in oklab,var(--c) 45%,transparent)}
.sub + .sub{border-top:1px dashed color-mix(in oklab,var(--c) 18%,transparent)}
.ev.free .tl-b{border-left:2px dashed var(--line-2);background:transparent;padding-left:11px}
.kids .nowtrack{margin-left:-28px}
.ev.free .free-head{cursor:default}
.ev.free .free-head .t{font-weight:400;color:var(--fg-2);font-size:13px}
.tl li.ev.free::after{background:var(--ink)}
.sub time{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);padding-top:2px;text-align:left}
.sub-b{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
/* 1時間ごとの線（記録があればその分ふくらむ） */
.tl li.hr{padding:0;min-height:20px}
.tl li.hr time{font-size:10.5px;padding-top:3px;opacity:.75}
.tl li.hr::after{left:53px;top:10px;width:11px;height:1px;border:0;border-radius:0;background:var(--line-2)}
.tl li.hr .tl-b{border-top:1px solid color-mix(in oklab,var(--line) 70%,transparent);margin-top:10px}
.tl li.hr.has{padding-bottom:4px}
.tl li.hr.has::after{background:var(--fg-3)}
.tl li.hr.has .kids{margin-top:4px;border-left-color:var(--line-2)}
.tl li.hr.future{opacity:.45}
.tl li.hr.future .tl-b{border-top-style:dashed}
/* 起きた：就寝と同じ、控えめな1行（実線） */
.tl li.wakeline{padding:3px 0;--c:var(--gold)}
.tl li.wakeline::after{left:55px;top:8px;width:7px;height:7px;background:color-mix(in oklab,var(--c) 75%,transparent);border:1px solid color-mix(in oklab,var(--c) 75%,transparent)}
.tl li.wakeline time{font-size:11px;padding-top:0}
.tl li.wakeline .tl-b{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;border-top:1px solid color-mix(in oklab,var(--c) 35%,transparent);margin-top:7px;padding:2px 0 0 2px;font-size:11.5px;color:var(--fg-2);letter-spacing:.02em}
/* 就寝・就寝の目安：予定のカードにせず、控えめな1行 */
.tl li.ev.bedline{padding:3px 0}
.tl li.ev.bedline::after{left:55px;top:8px;width:7px;height:7px;background:var(--ink);border:1px solid color-mix(in oklab,var(--c) 70%,transparent)}
.tl li.ev.bedline time{font-size:11px;padding-top:0}
.ev.bedline .tl-b{border:0;background:transparent;padding:0 0 0 2px;border-top:1px dashed color-mix(in oklab,var(--c) 35%,transparent);margin-top:7px;border-radius:0}
.ev.bedline .bl-t{display:inline-block;margin-top:2px;font-size:11.5px;color:var(--fg-3);letter-spacing:.02em;cursor:pointer}
.ev.bedline.done .tl-b{border-top-style:solid}
.ev.bedline.done .bl-t{color:var(--fg-2)}
.ev.bedline.done::after{background:color-mix(in oklab,var(--c) 70%,transparent)}
/* 起きた・寝た時刻を直す（さりげない ✎） */
.fixbtn{background:none;border:0;color:var(--fg-3);opacity:.55;font-size:11px;padding:0 4px;margin-left:2px;cursor:pointer;line-height:1}
.fixbtn:hover,.fixbtn:focus-visible{opacity:1;color:var(--fg)}
.wk-prev{margin-left:10px;color:var(--fg-3);font-size:11px}

.timefix{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 8px 2px 0;font-size:12px}
.timefix input[type=time]{padding:3px 6px;font-size:13px;width:auto}
/* 送信待ち・オフラインの小さな印 */
.dbstate{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3);border:1px solid var(--line-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.dbstate.off{color:var(--gold);border-color:color-mix(in oklab,var(--gold) 40%,transparent)}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2);display:inline-block}
.dots i.on{background:var(--c)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:16px;color:var(--fg-2);font-size:14px;margin-top:8px}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;background:linear-gradient(180deg,rgba(11,14,27,0),rgba(11,14,27,.96) 22%);padding-top:18px;padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer .in{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:8px 8px 8px 12px}
.composer.compact .comp-tools{display:none}
.composer.compact .in{padding-top:4px;padding-bottom:4px}
.comp-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--fg-3);margin-bottom:4px}
.comp-main{display:flex;gap:8px;align-items:flex-end}
.comp-main textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;outline:none;max-height:120px;line-height:1.5;padding:6px 0}
.comp-main textarea::placeholder{color:var(--fg-3)}
.toggle{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--fg-2)}
.toggle[aria-pressed="true"]{border-color:var(--lav);color:var(--lav);background:#1f1b42}
.pick{display:inline-flex;align-items:center;gap:2px}
.pick button{width:17px;height:17px;padding:0;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center}
.pick button i{width:7px;height:7px;border-radius:50%;background:transparent;display:block}
.pick button.on i{background:var(--c)}
.pick button.on{border-color:var(--c)}
@media (min-width:960px){.composer{left:84px}}

/* tasks */
.form{display:grid;gap:8px}
.form .line{display:flex;gap:8px;flex-wrap:wrap}
.form .line > *{min-width:0}
.field{background:var(--sky);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;outline:none}
.field:focus{border-color:var(--lav)}
input.field[type="date"],input.field[type="time"]{color-scheme:dark}
.grow{flex:1 1 180px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.task .head{display:flex;gap:10px;align-items:flex-start}
.task .title{flex:1;min-width:0;overflow-wrap:anywhere}
.task .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.check{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.check.on{background:var(--blue);border-color:var(--blue);color:#0d1730}
.check.gold.on{background:var(--gold);border-color:var(--gold);color:#2a2008}
.check svg{width:12px;height:12px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.steps{list-style:none;margin:10px 0 0;padding:0 0 0 32px;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:8px;align-items:center;font-size:14px}
.steps li span{overflow-wrap:anywhere;min-width:0}
.steps li.done span{color:var(--fg-3);text-decoration:line-through}
.task.done .title{color:var(--fg-3);text-decoration:line-through}
details.fold{margin-top:10px}
details.fold summary{cursor:pointer;color:var(--fg-2);font-size:13px;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ ";color:var(--fg-3)}
details.fold[open] summary::before{content:"▾ "}

/* memos */
.memos{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.memo{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.memo .txt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.memo .when{font-size:11px;color:var(--fg-3);font-family:var(--f-mono)}

/* goals */
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .title{flex:1;min-width:0;overflow-wrap:anywhere}
.goal.done .title{color:var(--gold)}

/* sky */
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px}
.crumbs button{background:none;border:0;color:var(--fg-2);padding:2px 0}
.crumbs button[aria-current="true"]{color:var(--fg);font-weight:500}
.crumbs .sep{color:var(--fg-3)}
.skybox{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 40%,#141a3a 0%,#0a0d1c 70%)}
.skybox canvas{display:block;width:100%;touch-action:manipulation}
.skynav{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.skynav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:rgba(16,20,42,.8);color:var(--fg-2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg-2);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--c)}
.legend i.neb{width:14px;height:8px;border-radius:50%;background:radial-gradient(closest-side,rgba(150,130,230,.55),transparent)}
.cname{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:.04em}

/* review */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 14px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .n{font-family:var(--f-mono);font-size:22px;font-weight:500}
.tile .n small{font-size:12px;color:var(--fg-3);font-weight:400}
.tile .l{font-size:12px;color:var(--fg-2)}
.chart{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px}
.chart .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px}
.chart .lg{display:flex;gap:12px;font-size:12px;color:var(--fg-2)}
.chart .lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;background:var(--c)}
.chart .lg i.dot{width:8px;height:8px;border-radius:50%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{fill:var(--fg-3);font-family:var(--f-mono);font-size:10px}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal7 .h{font-size:10px;color:var(--fg-3);text-align:center}
.cal7 .c{aspect-ratio:1;border-radius:7px;background:var(--m0);position:relative;font-family:var(--f-mono);font-size:10px;color:rgba(228,230,242,.7);padding:3px 4px;max-width:100%}
.cal7 .c.blank{background:transparent}
.cal7 .c.today{outline:1.5px solid var(--lav);outline-offset:1px}
.cal7 .c .neb{position:absolute;inset:0;border-radius:7px;background:radial-gradient(closest-side,rgba(184,167,255,.35),transparent)}
.ramp{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3);margin-top:6px}
.ramp i{width:14px;height:10px;border-radius:3px;display:inline-block}
.insight{white-space:pre-wrap}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,8,18,.86);backdrop-filter:blur(6px);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{max-width:560px;margin:6vh auto 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .card{padding:18px}
.sheet h3{font-family:var(--f-disp);font-size:22px;margin:0 0 6px;font-weight:700;text-wrap:balance}
.steps-dots{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.steps-dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.steps-dots i.on{background:var(--lav)}
.steps-dots i.done{background:#5c5299}
.nm-title{text-align:center;font-family:var(--f-disp);font-size:24px;font-weight:700;margin:6px 0 2px}
.nm-sub{text-align:center;color:var(--fg-2);font-size:13px;margin-bottom:14px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line-2);background:var(--sky);border-radius:10px;padding:10px 0;font-family:var(--f-mono);font-size:16px;color:var(--fg-2)}
.scale button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in oklab,var(--c) 22%,var(--sky));color:var(--fg)}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3);margin-top:4px}
textarea.field{width:100%;resize:vertical;min-height:84px;line-height:1.6}
.plan-item{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"time min nm del";gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:0}
.plan-item .nm{grid-area:nm;min-width:0;overflow-wrap:anywhere}
.plan-item input[type="time"]{grid-area:time;width:108px}
.plan-item select{grid-area:min;width:84px}
.plan-item .del{grid-area:del}
@media (max-width:520px){.plan-item{grid-template-columns:auto auto 1fr;grid-template-areas:"time min del" "nm nm nm";row-gap:4px}.plan-item .del{justify-self:end}}
.pick-list{display:flex;flex-wrap:wrap;gap:6px}
.pick-list button{border:1px dashed var(--line-2);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--fg-2);text-align:left;max-width:100%;overflow-wrap:anywhere}
.pick-list button:hover{border-color:var(--blue);color:var(--fg)}
.sendlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sendlist li{display:flex;gap:10px;align-items:baseline}
.sendlist .st{width:18px;flex-shrink:0;text-align:center}
.bigcheck{display:flex;gap:14px;align-items:center;width:100%;border:1px solid var(--line-2);background:var(--sky);border-radius:14px;padding:16px;font-size:17px;text-align:left}
.bigcheck[aria-pressed="true"]{border-color:var(--gold);background:#231f12}
.bigcheck .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;flex-shrink:0}
.bigcheck[aria-pressed="true"] .box{background:var(--gold);border-color:var(--gold);color:#2a2008}
.rise{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 100% at 50% 100%,#1a1840 0%,#0a0c1a 75%);border:1px solid var(--line)}
.rise canvas{display:block;width:100%}
.rise .nm{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:var(--f-disp);font-size:24px;font-weight:700;letter-spacing:.06em;opacity:0;transition:opacity 1.6s ease 2.6s}
.rise.go .nm{opacity:1}
.rise.static .nm{opacity:1;transition:none}
.claude{border-left:2px solid var(--lav);padding:2px 0 2px 12px;white-space:pre-wrap}
.note-local{border-left:2px solid var(--line-2);padding:2px 0 2px 12px;white-space:pre-wrap;font-size:14px;color:var(--fg-2)}
.thinking{color:var(--fg-3);font-size:13px}
.thinking::after{content:"…";animation:blink 1.2s steps(3) infinite}
@keyframes blink{50%{opacity:.3}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 140px);z-index:60;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;font-size:13px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.tip{position:fixed;z-index:70;pointer-events:none;background:#0f1328;border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.5;white-space:pre-wrap;max-width:min(320px,calc(100vw - 24px));box-shadow:0 6px 20px rgba(0,0,0,.4)}
.gamechip{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:help}
.ichip{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2)}
.ichip svg{color:var(--fg-3)}
.ichip b{font-weight:500}
.iconbtn{background:none;border:0;color:var(--fg-3);padding:4px;border-radius:7px;display:inline-grid;place-items:center;line-height:1}
.iconbtn:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.iconbtn:disabled{opacity:.4}
.plusbtn{font-size:16px;width:24px;height:24px;margin-right:2px}
.iconbtn.chev{align-self:center}
.iconbtn.chev svg{transition:transform .15s}
.iconbtn.chev.open svg{transform:rotate(90deg)}
.info{background:none;border:1px solid var(--line-2);color:var(--fg-3);width:16px;height:16px;border-radius:50%;font:italic 600 10px/14px Georgia,serif;padding:0;margin-left:6px;vertical-align:middle;cursor:help}
.info:hover{color:var(--fg-2);border-color:var(--fg-3)}
.nap{margin-right:6px}
.bell{display:inline-flex;align-items:center;gap:1px;vertical-align:-2px}
.mode{padding:9px 4px}
.top .sub{gap:14px}
.taskadd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;margin-bottom:8px}
.taskadd .line{display:flex;gap:8px;align-items:center}
.taskadd .plus{color:var(--fg-3);font-size:16px}
.taskadd .field.grow{border:0;background:transparent;padding:6px 0;flex:1;min-width:0}
.taskadd .more,.taskadd .add{display:none}
.taskadd.open,.taskadd:focus-within{border-color:var(--line-2)}
.taskadd.open .more{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 4px}
.taskadd.open .add{display:inline-block}
.settings .item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.settings .item:last-child{border-bottom:0}
.settings .item .l{min-width:0;flex:1 1 220px}
.settings .item .l small{display:block;color:var(--fg-3);font-size:12px}
.switch{width:46px;height:26px;border-radius:13px;border:1px solid var(--line-2);background:var(--sky);position:relative;flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg-3);transition:left .15s}
.switch[aria-checked="true"]{background:#2a2456;border-color:var(--lav)}
.switch[aria-checked="true"]::after{left:23px;background:var(--lav)}
.wd{display:flex;gap:4px}
.wd button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--fg-3);font-size:13px;padding:0}
.wd button[aria-pressed="true"]{border-color:var(--lav);color:var(--fg);background:#1f1b42}
.center-msg{max-width:520px;margin:18vh auto 0;padding:0 24px;text-align:center}
.center-msg h1{font-family:var(--f-disp);font-size:30px;margin:0 0 8px}
/* calendar */
.btn.danger{background:var(--warn);border-color:var(--warn);color:#2a1c05;font-weight:700}
.calchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.calchip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;color:var(--fg-3);display:inline-flex;align-items:center;gap:6px}
.calchip::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px solid var(--c)}
.calchip[aria-pressed="true"]{color:var(--fg)}
.calchip[aria-pressed="true"]::before{background:var(--c)}
.wk{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.wk-row{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr))}
.wk-head{border-bottom:1px solid var(--line)}
.wk-h{text-align:center;padding:6px 0 5px;font-size:11px;color:var(--fg-3);line-height:1.2}
.wk-h b{display:block;margin:2px auto 0;width:28px;height:28px;line-height:28px;font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--fg-2)}
.wk-h.is-today b{color:#17132f;background:var(--lav);border-radius:50%}
.wk-h.sun span,.n.sun{color:var(--rose)}
.wk-h.sat span,.n.sat{color:var(--blue)}
.wk-all{border-bottom:1px solid var(--line);min-height:24px}
.wk-a{padding:2px 1px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line)}
.wk-g{font-size:10px;color:var(--fg-3);text-align:right;padding:4px 4px 0 0;font-family:var(--f-mono)}
.wk-scroll{max-height:min(66vh,720px);overflow-y:auto;overscroll-behavior:contain}
.wk-body{position:relative}
.wk-hours{position:relative;padding:0}
.wk-hr{position:absolute;right:4px;transform:translateY(-5px);font-size:10px}
.wk-hr:first-child{transform:none}
.wk-col{position:relative;min-width:0;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px;cursor:copy}
.wk-col.is-today{background-color:rgba(184,167,255,.05)}
.wk-ev{position:absolute;border:0;border-left:3px solid var(--c);background:color-mix(in oklab,var(--c) 28%,var(--panel));color:var(--fg);border-radius:4px;padding:2px 3px;text-align:left;overflow:hidden;font-size:10.5px;line-height:1.25;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.wk-ev .t{overflow-wrap:anywhere;font-weight:500}
.wk-ev .m{font-family:var(--f-mono);font-size:9.5px;color:var(--fg-2)}
.wk-ev:hover{filter:brightness(1.15)}
.wk-now{position:absolute;left:0;right:0;height:2px;background:var(--lav);box-shadow:0 0 6px var(--lav);pointer-events:none}
.wk-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--lav)}
.ev-chip{border:0;border-left:3px solid var(--c);background:color-mix(in oklab,var(--c) 22%,var(--panel));border-radius:3px;font-size:10px;padding:1px 3px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);max-width:100%}
.mo{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.mo-w{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;color:var(--fg-3);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mo-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mo-c{min-height:82px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:3px 2px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;min-width:0;color:var(--fg)}
.mo-c:nth-child(7n){border-right:0}
.mo-c.out{opacity:.4}
.mo-c.sel{background:rgba(184,167,255,.09)}
.mo-c .n{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);padding:0 4px;align-self:flex-start}
.mo-c.is-today .n{color:#17132f;background:var(--lav);border-radius:10px}
.mo-e{display:block;font-size:10px;line-height:1.35;border-left:2px solid var(--c);padding-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.mo-more{font-size:10px;color:var(--fg-3);padding-left:3px}
.mo-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.mo-li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;border:0;border-left:3px solid var(--c);background:var(--sky);border-radius:6px;padding:7px 10px;text-align:left;color:var(--fg);font-size:14px}
.mo-li .t{min-width:0;overflow-wrap:anywhere}
.cs-grid{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:10px 12px;align-items:center;margin-top:14px;font-size:14px}
.cs-grid .lb{color:var(--fg-3);font-size:12px}
.cs-grid input[type="date"]{width:150px}
.cs-grid input[type="time"]{width:112px}
.cs-grid input[type="checkbox"]{width:20px;height:20px;accent-color:var(--lav)}
.tl-b[data-act]{cursor:pointer}
/* Claudeからの欄：ほかのカードと違う、ラベンダーの光る枠 */
.card.clcard{position:relative;border:1px solid #4b4387;background:linear-gradient(165deg,#221d4a 0%,#191838 55%,#151a31 100%);box-shadow:0 0 0 1px rgba(184,167,255,.06) inset,0 10px 28px -16px rgba(184,167,255,.45);padding:12px 16px 14px}
.cl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cl-badge{font-size:11px;letter-spacing:.14em;color:var(--lav);font-weight:700}
.cl-mode{font-size:11px;color:var(--fg-2);border:1px solid color-mix(in oklab,var(--c) 55%,transparent);border-radius:999px;padding:0 8px}
.cl-link{background:none;border:0;padding:2px 0;color:var(--fg-3);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.cl-link:hover{color:var(--lav)}
.cl-link:disabled{opacity:.5}
.cl-say{font-family:var(--f-disp);font-size:16px;line-height:1.75;margin-top:8px;padding-left:12px;border-left:2px solid var(--lav);white-space:pre-wrap;overflow-wrap:anywhere}
.cl-say.faint,.cl-say.thinking{font-family:var(--f-body);font-size:13px}
.cl-bed{margin-top:12px;padding-top:10px;border-top:1px solid rgba(184,167,255,.18)}
.cl-bk{font-size:11px;letter-spacing:.12em;color:var(--fg-3)}
.cl-reason{font-size:13px;color:var(--fg-2);margin-top:2px}
.bell{margin-left:8px;font-family:var(--f-body);font-size:10px;color:var(--fg-3);opacity:.7}
.bell.sent{opacity:.75}
/* goals in tasks */
.card.goals{position:relative;overflow:hidden;margin-top:14px;padding:16px 18px 10px;border:1px solid #4a4128;
  background:
    radial-gradient(1px 1px at 14% 22%, rgba(243,239,226,.55), transparent 60%),
    radial-gradient(1px 1px at 78% 16%, rgba(243,239,226,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 62% 70%, rgba(233,200,115,.45), transparent 60%),
    radial-gradient(1px 1px at 90% 58%, rgba(243,239,226,.35), transparent 60%),
    radial-gradient(1px 1px at 30% 86%, rgba(243,239,226,.3), transparent 60%),
    radial-gradient(140% 120% at 100% 0%, rgba(233,200,115,.13) 0%, transparent 55%),
    linear-gradient(160deg,#1d1f3e 0%,#141834 60%,#121530 100%);
  box-shadow:0 0 0 1px rgba(233,200,115,.06) inset,0 10px 30px -18px rgba(233,200,115,.35)}
.card.goals::after{content:"";position:absolute;right:14px;top:12px;width:70px;height:40px;pointer-events:none;opacity:.5;
  background:radial-gradient(circle,var(--gold) 1.4px,transparent 2px) 0 30px/8px 8px no-repeat,radial-gradient(circle,var(--gold) 1.2px,transparent 2px) 22px 14px/8px 8px no-repeat,radial-gradient(circle,var(--gold) 1.6px,transparent 2.2px) 44px 22px/8px 8px no-repeat,radial-gradient(circle,var(--gold) 1.2px,transparent 2px) 62px 4px/8px 8px no-repeat}
.goals-head{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.gc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card.goals.compact{padding:10px 14px 8px}
.card.goals.compact::after{top:6px;transform:scale(.8);transform-origin:right top}
.card.goals.compact .goals-title{font-size:16px}
.gedit{position:relative;z-index:1;background:transparent;border:1px solid rgba(233,200,115,.35);color:#cdbb85;border-radius:999px;font-size:12px;padding:2px 12px}
.gedit:hover,.gedit.on{border-color:var(--gold);color:var(--gold)}
.gc-row{display:grid;grid-template-columns:3em minmax(0,1fr);gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid rgba(233,200,115,.1)}
.gc-row:first-of-type{border-top:0}
.gc-k{font-size:11px;letter-spacing:.06em;color:#bfae7c}
.gc-v{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;min-width:0}
.gc-v .faint{font-size:12px}
.gc-g{font-family:var(--f-disp);font-weight:500;overflow-wrap:anywhere}
.gc-g i{font-style:normal;color:var(--gold);opacity:.75;margin-right:4px;font-size:11px}
.gc-g.done{color:var(--gold)}
.goals-title{font-family:var(--f-disp);font-size:22px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.goals-sub{font-size:11px;color:var(--fg-3);letter-spacing:.06em}
.card.goals .gblock{border-bottom-color:rgba(233,200,115,.14)}
